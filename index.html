<!doctype html>
<!--
  MorningFit — hosted privacy policy page (PUBLISH SOURCE).
  Deploy: replace index.html in the yassinyazidi/morningfit-policy GitHub
  Pages repo with this file. The app loads it remotely at
  https://yassinyazidi.github.io/morningfit-policy/ (see PRIVACY_POLICY_URL
  in www/js/21-me.js) — nothing under www/ may duplicate this copy.
  Typeface must stay Tajawal to match the app (www/css/core/fonts.css).
-->
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MorningFit privacy policy / سياسة الخصوصية لتطبيق MorningFit">
  <title>سياسة الخصوصية | MorningFit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html[data-theme="light"] { color-scheme: light; --pp-bg: #ffffff; --pp-ink: #18302b; --pp-muted: #50645d; --pp-card-border: #e6eeea; }
    html[data-theme="dark"] { color-scheme: dark; --pp-bg: #0b0b08; --pp-ink: #ffffff; --pp-muted: #b8c4be; --pp-card-border: #2a2f2c; }
    body { margin: 0; padding: 0; background: var(--pp-bg); color: var(--pp-ink); font-family: "Tajawal", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; line-height: 1.8; }
    main { padding: 18px 20px 24px; }
    h3 { margin: 22px 0 6px; font-size: 16px; font-weight: 800; color: var(--pp-ink); }
    h3:first-child { margin-top: 0; }
    p { margin: 8px 0; color: var(--pp-ink); }
    p.updated { color: var(--pp-muted); font-size: 13px; }
    ul { margin: 8px 0; padding-inline-start: 22px; }
    li { margin: 8px 0; color: var(--pp-ink); }
  </style>
</head>
<body>
  <main id="policyRoot" aria-live="polite"></main>
  <script>
    /* MorningFit — hosted privacy policy.
       Rendered from the ?lang= (ar|en) and ?theme= (light|dark) query params
       the app passes in the iframe src. No network calls besides the Tajawal
       webfont above: all copy is embedded so the page also paints offline
       from cache once visited. */
    (function () {
      var COPY = {
        ar: {
          updated: "آخر تحديث: 10 أكتوبر 2026",
          intro: "توضح هذه السياسة كيف يتعامل تطبيق MorningFit مع المعلومات عند استخدام التطبيق. يعمل التطبيق على جهازك، ولا يتطلب إنشاء حساب لاستخدام ميزات التدريب الأساسية.",
          collectTitle: "المعلومات التي نخزنها",
          collectItems: [
            "على جهازك: قد يخزن التطبيق بيانات الملف الشخصي والتفضيلات وخطط التمرين والجلسات المكتملة وسجل التقدم والتذكيرات محلياً لتشغيل الميزات وحفظ تقدمك.",
            "إذا اخترت تسجيل الدخول إلى Google واستخدام المزامنة: قد تُرسل بيانات الملف الشخصي مثل الاسم والعمر والطول والوزن والهدف ومستوى التدريب، واللغة وإعدادات الإشعارات وسجلات التمارين المكتملة إلى Supabase لتخزينها ومزامنتها بين أجهزتك. قد يعالج مزود تسجيل الدخول بريدك الإلكتروني ومعرّف حسابك للمصادقة.",
            "إذا طلبت رمز QR للمشاركة، يُرسل رابط التطبيق إلى خدمة QR خارجية لإنشاء الصورة. يحدث ذلك عند فتح ميزة رمز QR فقط.",
            "قد تُحمّل صور المدربين من Pexels عند عرضها. تُجدول التذكيرات محلياً على جهازك."
          ],
          useTitle: "كيفية استخدام المعلومات",
          useBody: "نستخدم المعلومات لتشغيل التطبيق، وحفظ إعداداتك وتقدمك، وتخصيص التدريب، ومزامنة البيانات التي اخترت مزامنتها. لا يتضمن الإصدار الحالي إعلانات مدمجة ولا يبيع بياناتك.",
          retentionTitle: "الاحتفاظ والحذف",
          retentionBody: "تبقى البيانات المحلية على جهازك إلى أن تحذف بيانات التطبيق أو تزيله. قد تظل البيانات المتزامنة مرتبطة بحسابك. لا يتوفر حالياً داخل التطبيق خيار لطلب حذف البيانات المتزامنة.",
          securityTitle: "الأمان والأطفال",
          securityBody: "عند اختيار المزامنة، نستخدم خدمات المصادقة والتخزين التابعة لمزودي الخدمة. لا يمكن ضمان أمان النقل أو التخزين بشكل مطلق. التطبيق غير مخصص للأطفال دون 13 عاماً.",
          updatesTitle: "تحديثات السياسة",
          updatesBody: "قد نحدّث هذه السياسة عند تغير التطبيق."
        },
        en: {
          updated: "Last updated: October 10, 2026",
          intro: "This policy explains how MorningFit handles information when you use the app. The app runs on your device, and an account is not required for its core workout features.",
          collectTitle: "Information we store",
          collectItems: [
            "On your device: the app may store profile details, preferences, workout plans, completed sessions, progress history, and reminders locally to provide its features and save your progress.",
            "If you choose Google sign-in and cloud sync: profile details such as name, age, height, weight, goal, and training level, plus language, notification settings, and completed workout records may be sent to Supabase for storage and syncing across your devices. The sign-in provider may process your email address and account identifier for authentication.",
            "If you request a share QR code, the app sends its link to an external QR service to create the image. This happens only when you open the QR feature.",
            "Trainer images may load from Pexels when displayed. Reminders are scheduled locally on your device."
          ],
          useTitle: "How information is used",
          useBody: "We use information to run the app, save your settings and progress, personalize workouts, and sync data you chose to sync. The current version does not include integrated advertising or sell your data.",
          retentionTitle: "Retention and deletion",
          retentionBody: "Local data remains on your device until you clear the app's data or uninstall it. Synced data may remain associated with your account. The app currently has no in-app option to request deletion of synced data.",
          securityTitle: "Security and children",
          securityBody: "When you choose sync, we use authentication and storage services operated by service providers. No transmission or storage method can be guaranteed completely secure. The app is not intended for children under 13.",
          updatesTitle: "Policy updates",
          updatesBody: "We may update this policy when the app changes."
        }
      };

      function currentLang() {
        try {
          var q = new URLSearchParams(window.location.search).get('lang');
          if (q === 'en' || q === 'ar') return q;
        } catch (_) {}
        var html = document.documentElement;
        if (html && (html.lang === 'en' || html.lang === 'ar')) return html.lang;
        return 'ar';
      }

      function currentTheme() {
        try {
          var q = new URLSearchParams(window.location.search).get('theme');
          if (q === 'dark' || q === 'light') return q;
        } catch (_) {}
        try {
          if (window.parent && window.parent.document) {
            var t = window.parent.document.documentElement.getAttribute('data-theme');
            if (t === 'dark' || t === 'light') return t;
          }
        } catch (_) {}
        var own = document.documentElement.getAttribute('data-theme');
        return own === 'dark' ? 'dark' : 'light';
      }

      function render(lang) {
        var copy = COPY[lang] || COPY.ar;
        var root = document.getElementById('policyRoot');
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.title = lang === 'ar' ? 'سياسة الخصوصية | MorningFit' : 'Privacy policy | MorningFit';
        while (root.firstChild) root.removeChild(root.firstChild);

        function el(tag, text, cls) {
          var n = document.createElement(tag);
          if (cls) n.className = cls;
          n.textContent = text || '';
          return n;
        }

        root.appendChild(el('p', copy.updated, 'updated'));
        root.appendChild(el('p', copy.intro));

        function addSection(heading, text, items) {
          root.appendChild(el('h3', heading));
          if (Array.isArray(items)) {
            var list = document.createElement('ul');
            items.forEach(function (item) {
              var li = document.createElement('li');
              li.textContent = item;
              list.appendChild(li);
            });
            root.appendChild(list);
          } else {
            root.appendChild(el('p', text));
          }
        }

        addSection(copy.collectTitle, null, copy.collectItems);
        addSection(copy.useTitle, copy.useBody);
        addSection(copy.retentionTitle, copy.retentionBody);
        addSection(copy.securityTitle, copy.securityBody);
        addSection(copy.updatesTitle, copy.updatesBody);
      }

      var theme = currentTheme();
      document.documentElement.setAttribute('data-theme', theme);
      render(currentLang());

      /* Follow the host app when it switches language/theme without reload. */
      try {
        window.addEventListener('message', function (evt) {
          var d = evt && evt.data;
          if (!d || d.type !== 'morningfit-policy') return;
          if (d.theme === 'dark' || d.theme === 'light') {
            document.documentElement.setAttribute('data-theme', d.theme);
          }
          if (d.lang === 'ar' || d.lang === 'en') render(d.lang);
        });
      } catch (_) {}
    })();
  </script>
</body>
</html>
